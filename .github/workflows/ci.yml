name: CI

# Portaal-gezondheidsonderzoek Blok B2: er was tot nu toe geen enkele
# geautomatiseerde check — een fout kon zo in elke push meegaan. Draait
# dezelfde verificatie die elke commit op deze repo al handmatig doorloopt
# (tsc + lint + build + tests), plus de B1-regressietest op
# databasepolicies/functies.
#
# De B1-check draait tegen een wegwerp-Supabase-stack die ALLE
# supabase/migrations/*.sql in volgorde toepast — niet tegen de live
# database. Daardoor is er geen productie-service-role-sleutel nodig (en
# dus geen risico die ooit in een PR-build van deze repo te laten
# meelopen); de lokale stack heeft haar eigen, niet-geheime demo-sleutels.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # Draait zonder Supabase-omgevingsvariabelen: elke route in dit
        # project is server-rendered on demand (geen statische data-fetch
        # tijdens build), dus dit slaagt ook zonder live databasetoegang.
        run: npm run build

      - name: Tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lokale Supabase-stack starten (past alle migraties toe)
        run: supabase start

      - name: Lokale API-URL/sleutel doorgeven aan de volgende stap
        # --override-name zet de standaard status-variabelen direct onder
        # dezelfde naam als createAdminClient() (src/lib/supabase/admin.ts)
        # verwacht — zelfde patroon als het officiële CLI-voorbeeld
        # ("supabase status --help").
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name api.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: DB-regressietest (policies/functies)
        run: npm run db:snapshot:check
