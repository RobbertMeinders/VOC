name: CI

# Portaal-gezondheidsonderzoek Blok B2: er was tot nu toe geen enkele
# geautomatiseerde check — een fout kon zo in elke push meegaan. Draait
# dezelfde verificatie die elke commit op deze repo al handmatig doorloopt
# (tsc + lint + build + tests), plus de B1-regressietest op
# databasepolicies/functies.
#
# De B1-check draait tegen een wegwerp-Supabase-stack die ALLE
# supabase/migrations/*.sql in volgorde toepast — niet tegen de live
# database. Daardoor is er geen productie-service-role-sleutel nodig (en
# dus geen risico die ooit in een PR-build van deze repo te laten
# meelopen); de lokale stack heeft haar eigen, niet-geheime demo-sleutels.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Draait zonder Supabase-omgevingsvariabelen: elke route in dit
        # project is server-rendered on demand (geen statische data-fetch
        # tijdens build), dus dit slaagt ook zonder live databasetoegang.
        # Genereert ook .next/types/** (Next.js' eigen gegenereerde globale
        # types, zoals LayoutProps<"/"> in layout.tsx) — moet daarom vóór
        # Typecheck draaien, anders faalt tsc op elke verse checkout met
        # "Cannot find name 'LayoutProps'" (lokaal viel dit niet op omdat
        # daar al build-output van een eerdere run stond).
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lokale Supabase-stack starten (past alle migraties toe)
        run: supabase start

      - name: Lokale API-URL/sleutel doorgeven aan de volgende stap
        # api.url bleek via --override-name wel te matchen, maar de
        # service-role-sleutel staat in de status-dump onder een andere
        # instellingsnaam (niet api.service_role_key) en kwam er zo stil
        # ongemapt uit. Simpeler en onafhankelijk van hoe de CLI zijn
        # instellingen noemt: de dump met standaardnamen laten staan
        # (zet SERVICE_ROLE_KEY e.d. in $GITHUB_ENV) en in een losse stap
        # expliciet doormappen naar de namen die createAdminClient()
        # (src/lib/supabase/admin.ts) verwacht.
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Omgevingsvariabelen hernoemen naar wat de app verwacht
        # `supabase status -o env` schrijft dotenv-stijl GEQUOTE waarden
        # (bv. API_URL="http://..."), maar $GITHUB_ENV neemt alles ná het
        # eerste "=" letterlijk over — inclusief die aanhalingstekens. Zonder
        # ze te strippen begint de doorgegeven URL met een letterlijke " en
        # faalt @supabase/supabase-js' eigen URL-validatie ("Invalid
        # supabaseUrl"), ook al oogt de waarde in de Actions-log geldig (de
        # log-weergave citeert z'n eigen aanhalingstekens, zo bleek).
        run: |
          url="${API_URL%\"}"; url="${url#\"}"
          key="${SERVICE_ROLE_KEY%\"}"; key="${key#\"}"
          echo "NEXT_PUBLIC_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: DB-regressietest (policies/functies)
        run: npm run db:snapshot:check
